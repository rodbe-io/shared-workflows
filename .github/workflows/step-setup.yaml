name: Get basic information
on:
  workflow_call:
    outputs:
      NODE_VERSION:
        description: Node.js version
        value: ${{ jobs.setup.outputs.NODE_VERSION }}
      PNPM_VERSION:
        description: PNPM version
        value: ${{ jobs.setup.outputs.PNPM_VERSION }}

env:
  HUSKY: 0

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      NODE_VERSION: ${{ steps.versions.outputs.NODE_VERSION }}
      PNPM_VERSION: ${{ steps.versions.outputs.PNPM_VERSION }}
    steps:
      - name: Get setup versions
        id: versions
        uses: rodbe-io/shared-workflows/.github/actions/get-setup-versions@main
