name: Pkg - Release and Publish
on:
  workflow_call:
    inputs:
      enable-test-unit:
        default: true
        description: Enable unit tests => pnpm run test:unit
        type: boolean

    secrets:
      GH_TOKEN:
        description: provided by secrets.GITHUB_TOKEN
        required: false
      NPM_REGISTRY_TOKEN:
        description: if npmrc exists, it is used with the NPM_REGISTRY_TOKEN env
        required: false
      MY_ENV_1:
        required: false
      MY_ENV_2:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # ${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

env:
  HUSKY: 0
  NPM_REGISTRY_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
  MY_ENV_1: ${{ secrets.MY_SECRET_TEST }}
  MY_ENV_2: 'desde el shared'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      NODE_VERSION: ${{ steps.versions.outputs.NODE_VERSION }}
      PNPM_VERSION: ${{ steps.versions.outputs.PNPM_VERSION }}
    steps:
      - name: Get setup versions
        id: versions
        uses: rodbe-io/shared-workflows/.github/actions/get-setup-versions@main

  release:
    name: Release
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Runtime Setup
        uses: rodbe-io/shared-workflows/.github/actions/runtime-setup@main
        with:
          node-version: ${{ needs.setup.outputs.NODE_VERSION }}
          pnpm-version: ${{ needs.setup.outputs.PNPM_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Check unit tests
        if: ${{ inputs.enable-test-unit }}
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ env.GH_TOKEN }}
        run: pnpm run release
