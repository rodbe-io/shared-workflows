name: Pkg - Release and Publish
on:
  workflow_call:
    inputs:
      enable-test-unit:
        default: true
        description: Enable unit tests => pnpm run test:unit
        type: boolean

    secrets:
      GH_TOKEN:
        description: provided by secrets.GITHUB_TOKEN
        required: false
      NPM_REGISTRY_TOKEN:
        description: if npmrc exists, it is used with the NPM_REGISTRY_TOKEN env
        required: false
      MY_ENV_1:
        required: false
      MY_ENV_2:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # ${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

env:
  HUSKY: 0
  NPM_REGISTRY_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
  MY_ENV_1: ${{ secrets.MY_SECRET_TEST }}
  MY_ENV_2: 'desde el shared'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  setup:
    uses: ./.github/workflows/step-setup.yaml

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: ${{ needs.setup.outputs.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.setup.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - name: Log outputs for debugging
        run: |
          echo "NODE_VERSION: ${{ needs.setup.outputs.NODE_VERSION }}"
          echo "PNPM_VERSION: ${{ needs.setup.outputs.PNPM_VERSION }}"

      # - name: Setup PNPM
      #   uses: pnpm/setup@v2.1.0
      #   with:
      #     cache: true
      #     install: false
      #     require-lockfile: true
      #     runtime: node@${{ needs.setup.outputs.NODE_VERSION }}
      #     version: ${{ needs.setup.outputs.PNPM_VERSION }}

      - name: Install Dependencies
        run: pnpm i --prefer-offline

      - name: Check unit tests
        if: ${{ inputs.enable-test-unit }}
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ env.GH_TOKEN }}
        run: pnpm run release
