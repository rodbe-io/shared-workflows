name: 'Node.js Setup'
description: 'Extraer versiones de Node y PNPM'

outputs:
  NODE_VERSION:
    description: 'Versión de Node.js extraída de package.json (volta.node)'
    value: ${{ steps.get-versions-run.outputs.NODE_VERSION }}
  PNPM_VERSION:
    description: 'Versión de PNPM extraída de package.json (packageManager)'
    value: ${{ steps.get-versions-run.outputs.PNPM_VERSION }}

runs:
  using: 'composite'
  steps:
    - name: Install O.S Dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Get Node and PNPM versions
      id: get-versions-run
      shell: bash
      run: |
        echo "NODE_VERSION=$(cat package.json | jq -r '.volta.node')" >> $GITHUB_OUTPUT
        echo "PNPM_VERSION=$(cat package.json | jq -r '.packageManager' | awk -F'@' '{print $2}')" >> $GITHUB_OUTPUT

    - name: Log outputs
      shell: bash
      run: |
        echo "NODE_VERSION: ${{ steps.get-versions-run.outputs.NODE_VERSION }}"
        echo "PNPM_VERSION: ${{ steps.get-versions-run.outputs.PNPM_VERSION }}"
