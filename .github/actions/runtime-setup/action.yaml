name: 'Runtime Setup'
description: 'Install and configure pnpm and Node.js with cache, and install the project dependencies'

inputs:
  node-version:
    description: 'Node.js version to install'
    required: true
  pnpm-version:
    description: 'PNPM version to install'
    required: true
  registry-url:
    description: 'Registry to use for Node.js/npm for example https://npm.pkg.github.com'
    default: ''
    required: false

runs:
  using: 'composite'
  steps:
    - name: Check pnpm major version
      id: pnpm-major
      shell: bash
      run: |
        MAJOR="${PNPM_VERSION%%.*}"
        if [ "$MAJOR" -ge 11 ]; then
          echo "gte_11=true" >> "$GITHUB_OUTPUT"
        else
          echo "gte_11=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        PNPM_VERSION: ${{ inputs.pnpm-version }}

    - name: Setup pnpm >= 11
      if: steps.pnpm-major.outputs.gte_11 == 'true'
      uses: pnpm/setup@v2.1.0
      with:
        cache: true
        install: false
        require-lockfile: true
        version: ${{ inputs.pnpm-version }}

    - name: Setup pnpm < 11
      if: steps.pnpm-major.outputs.gte_11 == 'false'
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        registry-url: ${{ inputs.registry-url }}
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --prefer-offline
